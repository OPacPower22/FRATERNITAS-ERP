databases:
  - name: fraternitas-db
    databaseName: fraternitas
    user: fraternitas
    plan: free          # 1 GB · CADUCA A LOS 30 DÍAS · sin respaldos
    region: oregon

services:
  - type: web
    name: fraternitas-erp
    runtime: python
    plan: free          # 512 MB · se suspende tras 15 min sin tráfico
    region: oregon
    branch: main
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --workers 2 --timeout 60"
    healthCheckPath: /login/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: SECRET_KEY
        generateValue: true          # Render genera una clave y la conserva
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: fraternitas-db
          property: connectionString
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false                  # se captura en el panel de Render
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
