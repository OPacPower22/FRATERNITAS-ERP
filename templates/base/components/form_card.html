<div class="card">

    <h2>{{ titulo }}</h2>

    {% if subtitulo %}
        <p>{{ subtitulo }}</p>
    {% endif %}

    <form method="post">

        {% csrf_token %}

        <div class="form-grid">

            {{ contenido }}

        </div>

        <div class="actions">

            <button
                type="reset"
                class="btn-secondary">

                Cancelar

            </button>

            <button
                type="submit"
                class="btn-primary">

                Guardar

            </button>

        </div>

    </form>

</div>
