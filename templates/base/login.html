{% load static %}
<!DOCTYPE html>
<html lang="es-MX">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>FRATERNITAS-ERP | Iniciar Sesión</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            margin:0;
            padding:0;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#f4f4f4;
            font-family:Calibri, Arial, sans-serif;
        }

        .login-card{

            width:100%;
            max-width:460px;

            background:#ffffff;

            border-top:8px solid #CE1126;

            border-radius:12px;

            box-shadow:0 10px 30px rgba(0,0,0,.18);

            padding:40px;

        }

        .logo{

            width:120px;
            height:120px;

            object-fit:contain;

            margin-bottom:20px;

        }

        h1{

            font-size:1.70rem;
            font-weight:bold;
            color:#000;

        }

        h2{

            font-size:1rem;
            color:#666;

            margin-bottom:25px;

        }

        label{

            font-weight:600;

        }

        .btn-login{

            background:#CE1126;
            border:none;

            font-weight:bold;

            padding:12px;

        }

        .btn-login:hover{

            background:#a30d1f;

        }

        .footer{

            margin-top:25px;

            text-align:center;

            color:#666;

            font-size:.85rem;

        }

    </style>

</head>

<body>

<div class="login-card">

    <div class="text-center">

        <img
            src="{% static 'img/escudo.png' %}"
            class="logo"
            alt="Fraternidad No. 1">

        <h1>

            FRATERNITAS-ERP

        </h1>

        <h2>

            Sistema Integral de Gestión de Tesorería

        </h2>

    </div>

    {% if form.errors %}

        <div class="alert alert-danger">

            Usuario o contraseña incorrectos.

        </div>

    {% endif %}

    <form method="post">

        {% csrf_token %}

        <div class="mb-3">

            <label for="id_username">

                Usuario

            </label>

            <input
                type="text"
                name="username"
                id="id_username"
                class="form-control"
                autofocus
                required>

        </div>

        <div class="mb-4">

            <label for="id_password">

                Contraseña

            </label>

            <input
                type="password"
                name="password"
                id="id_password"
                class="form-control"
                required>

        </div>

        <div class="d-grid">

            <button
                type="submit"
                class="btn btn-danger btn-login">

                Ingresar

            </button>

        </div>

        {% if next %}

            <input
                type="hidden"
                name="next"
                value="{{ next }}">

        {% endif %}

    </form>

    <div class="footer">

        <strong>

            Resp.·. Log.·. Simb.·. Fraternidad No. 1

        </strong>

        <br>

        FRATERNITAS-ERP

        <br>

        Versión de Desarrollo

    </div>

</div>

</body>

</html>
