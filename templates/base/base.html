<!DOCTYPE html>
<html lang="es">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FRATERNITAS ERP{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/frater.css' %}">

    <style>

        body{
            margin:0;
            font-family:Arial, Helvetica, sans-serif;
            background:#f5f5f5;
        }

        header{
            background:#5B0000;
            color:white;
            padding:15px 25px;
            font-size:24px;
            font-weight:bold;
        }

        nav{
            width:240px;
            background:#212121;
            color:white;
            position:fixed;
            top:58px;
            bottom:0;
            left:0;
            padding-top:20px;
        }

        nav a{
            display:block;
            color:white;
            text-decoration:none;
            padding:12px 20px;
        }

        nav a:hover{
            background:#C60800;
        }

        main{
            margin-left:260px;
            padding:30px;
        }

    </style>

</head>

<body>

<header>

    FRATERNITAS ERP

</header>

<nav>

    <a href="#">Dashboard</a>
    <a href="#">Tesorería</a>
    <a href="#">Contabilidad</a>
    <a href="#">Miembros</a>
    <a href="#">Reportes</a>

</nav>

<main>

{% block content %}

{% endblock %}

</main>

</body>
</html>
